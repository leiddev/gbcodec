name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-tables:
    name: Verify generated tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check that src/detail/gb2312_table.c is up to date
        run: python3 tools/gen_gb2312_table.py --check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (MSVC)
            os: windows-latest
            platform: x64
            arch_flags: ""
            sanitizers: "OFF"
          - name: Windows x86 (MSVC)
            os: windows-latest
            platform: Win32
            arch_flags: ""
            sanitizers: "OFF"
          - name: Linux x64 (GCC)
            os: ubuntu-latest
            platform: ""
            arch_flags: ""
            sanitizers: "OFF"
          - name: Linux x86 (GCC -m32)
            os: ubuntu-latest
            platform: ""
            arch_flags: "-m32"
            sanitizers: "OFF"
          - name: Linux x64 (GCC, ASan + UBSan)
            os: ubuntu-latest
            platform: ""
            arch_flags: ""
            sanitizers: "ON"
          - name: Windows x64 (MSVC, shared)
            os: windows-latest
            platform: x64
            arch_flags: ""
            sanitizers: "OFF"
            shared: "ON"
          - name: Linux x64 (GCC, shared)
            os: ubuntu-latest
            platform: ""
            arch_flags: ""
            sanitizers: "OFF"
            shared: "ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install 32-bit toolchain
        if: matrix.arch_flags == '-m32'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ -n "${{ matrix.platform }}" ]; then
            extra+=("-DCMAKE_GENERATOR_PLATFORM=${{ matrix.platform }}")
          fi
          if [ -n "${{ matrix.arch_flags }}" ]; then
            extra+=("-DCMAKE_C_FLAGS=${{ matrix.arch_flags }}")
            extra+=("-DCMAKE_CXX_FLAGS=${{ matrix.arch_flags }}")
            extra+=("-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.arch_flags }}")
            extra+=("-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.arch_flags }}")
          fi
          if [ "${{ matrix.sanitizers }}" = "ON" ]; then
            extra+=("-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer")
            extra+=("-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer")
            extra+=("-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined")
            extra+=("-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined")
          fi
          if [ "${{ matrix.shared }}" = "ON" ]; then
            extra+=("-DBUILD_SHARED_LIBS=ON")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DGBCODEC_WARNINGS_AS_ERRORS=ON "${extra[@]}"

      # High ASLR entropy makes the ASan shadow mapping fail at startup on
      # some runners; lowering it keeps the sanitizer job deterministic.
      - name: Reduce ASLR entropy
        if: matrix.sanitizers == 'ON'
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  package:
    name: Install and consume the package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and install
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DGBCODEC_BUILD_TESTS=OFF -DGBCODEC_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"
          cmake --build build --parallel
          cmake --install build

      - name: pkg-config metadata
        run: |
          export PKG_CONFIG_PATH="$PWD/stage/lib/pkgconfig"
          pkg-config --modversion gbcodec
          pkg-config --cflags --libs gbcodec

      - name: Build a consumer with find_package
        run: |
          cmake -S tests/package -B consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build consumer --parallel
          ctest --test-dir consumer --output-on-failure
